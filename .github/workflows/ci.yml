name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # Prisma generate n'a pas besoin d'une vraie connexion, seule l'URL doit être bien formée.
      DATABASE_URL: "mysql://quiz_user:quiz_password@127.0.0.1:3306/quiz_game"

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Vérifier la compilation TypeScript
        run: npm run build

      - name: Lancer les tests
        run: npm test

      - name: Construire l'image Docker (validation du Dockerfile)
        run: docker build -t quiz:ci .
